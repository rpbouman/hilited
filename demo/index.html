<!doctype html>
<html>
  <head>
    <title>Hilited</title>
    <link rel="stylesheet" type="text/css" href="../src/Hilited.css"/>
    <script src="../src/SelectionHelper.js"></script>
    <script src="../src/Hilited.js"></script>
    <script src="./samples.js"></script>
    <script src="../../RegXpChef/src/RegXpChef.js"></script>
  </head>
  <body>
    <section class="hilited">
      <menu role="toolbar">
        <li item="menu-item">
          <label for="openFile">Open File
            <input id="openFile" type="file"/>
          </label>
        </li>
        <li item="menu-item">
          <label for="language">Language</label>
          <select id="language">
            <option></option>
          </select>
        </li>
      </menu>
      <pre
        class="hilited-gutter"
        style="
          display: inline-block;
          position: relative;
          width: 8ch;
        "
      >
      </pre>
      <code 
        class="hilited-editor"
        style="
          tab-size:4;
          width: 80ch;
          height: 21rem;
        "
      >{
  "numberkey": 1.234,
  "stringkey": "string value",
  "nullkey": null,
  "truekey": true,
  "falsekey": false
}</code>
      <menu role="toolbar">
        <li class="hilited-length">
          <label for="length">length</label>
          <output id="length"></output>
        </li>
        <li class="hilited-lines">
          <label for="lines">lines</label>
          <output id="lines"></output>
        </li>
        <li class="hilited-line">
          <label for="line">Ln</label>
          <output id="line"></output>
        </li>
        <li class="hilited-column">
          <label for="line">Col</label>
          <output id="column"></output>
        </li>
        <li class="hilited-position">
          <label for="line">Pos</label>
          <output id="position"></output>
        </li>
      </menu>
    </section>

    <script>
      var hilitedElementEditor = document.querySelector('.hilited-editor');
      var syncingGutterTimeout = undefined;
      var resizeObserver = new ResizeObserver(function(){
        if (syncingGutterTimeout !== undefined){
          clearTimeout(syncingGutterTimeout);
        }
        syncingGutterTimeout = setTimeout(syncGutterLines, 250);
      });
      resizeObserver.observe(hilitedElementEditor);

      function syncGutterLines(){
        var gutter = document.querySelector('.hilited-gutter'); 
        const height = hilitedElementEditor.offsetHeight;
        let lastElementChild = gutter.lastElementChild;
        let childHeight = lastElementChild ? lastElementChild.offsetTop + lastElementChild.clientHeight : 0;
        while (childHeight < height) {
          child = document.createElement('div');
          child.textContent = String.fromCharCode(160);
          gutter.appendChild(child);
          childHeight = child.offsetTop + child.clientHeight;
        }
        lastElementChild = gutter.lastElementChild;
        childHeight = lastElementChild ? lastElementChild.offsetTop + lastElementChild.clientHeight : 0;
        while (
          (lastElementChild = gutter.lastElementChild) && 
          (lastElementChild.offsetTop + lastElementChild.clientHeight) > height
        ){
          gutter.removeChild(gutter.lastElementChild);
        }
        syncingGutterTimeout = undefined;
      }
  
      function updatePosition(){
        if (selectionChanged === true) {
          return;
        }
        // first, ensure this selection change pertains to our editor
        var selection = document.getSelection();
        var focusNode = selection.focusNode;
        var node = focusNode;
        if (node.nodeType === 3) {
          node = node.parentNode;
        }

        if (node !== hilitedElementEditor) {
          // selection is not about our editor, leave
          return;
        }
       
        //selection is about our editor.
        var childNodes = hilitedElementEditor.childNodes;
        var text = '';
        _loop: for (var i = 0; i < childNodes.length; i++){
          node = childNodes[i];
          switch (node.nodeType){
            case 3:
              var end;
              if (node === focusNode) {
                text += node.data.slice(0, selection.focusOffset);
                break _loop;
              }
              else {
                text += node.data;
              }
              break;
            default: continue;
          }
        }
        // set the position
        document.getElementById('position').textContent = text.length + 1;

        // set the line
        var lineCount = 0;
        var index = 0;
        while(true) {
          index = text.indexOf('\n', index) + 1;
          if (!index){
            break;
          }
          lineCount += 1;
        }
        document.getElementById('line').textContent = lineCount + 1;
        
        if (focusNode.nodeType === 1) {
          focusNode = focusNode.previousSibling;
        }
        // set the column
        var column = selection.focusOffset;
        text = focusNode.data.slice(0, column);
        var index = text.lastIndexOf('\n');
        if (index !== -1){
          column = column - index;
        }
        column += 1;

        document.getElementById('column').textContent =  column;
      }

      var selectionChanged = false;
      document.addEventListener('selectionchange', function(event){
        selectionChanged = true;
      });
      
      setInterval(function(){
        if (selectionChanged === true){ 
          selectionChanged = false;
          updatePosition();
        }
      }, 250);
      
      hilitedElementEditor.addEventListener('input', function(event){
        setTimeout(function(){
          document.getElementById('length').textContent = hilited.getText().length + 1;
          document.getElementById('lines').textContent = hilited.getLineCount();
        },100);
      });
    </script>
    
    <script>
      var hilitedElementEditor = document.querySelector('.hilited-editor');
      const language = document.getElementById('language');
      let hilited = undefined;
      function instantiateEditor(){
        const value = language.value;
        const sample = hilitedSamples[value];
        hilitedElementEditor.textContent = sample.code;
        const styles = sample.styles;
        const stylesheet = document.getElementById(styles);
        if ( !stylesheet ){
          const linkElement = document.createElement('link');
          linkElement.rel = "stylesheet";
          linkElement.type = "text/css";
          linkElement.href = styles;
          linkElement.id = styles;
          document.head.appendChild(linkElement);
        }
        
        const highlighterPrefix = sample.highlighterPrefix;
        const regexp = sample.regexp;
        if (hilited){
          hilited.destroy();
        }
        hilited = new Hilited({
          element: '.hilited-editor',
          hardTabs: false,
          highlighterPrefix: highlighterPrefix,
          regexp: regexp
        });
        hilitedElementEditor.focus();
      }
      
      language.addEventListener('change', event => instantiateEditor());
      
      language.innerHTML = Object.keys(hilitedSamples).sort((a,b) => {
        const sampleA = hilitedSamples[a];
        a = sampleA.label || a;
        const sampleB = hilitedSamples[b];
        b = sampleB.label || b;
        
        if (a > b) return 1;
        if (a < b) return -1;
        return 0;
      }).map((key, index) => {
        return `<option value="${key}">${hilitedSamples[key].label}</option>`
      }).join('\n');
      
      instantiateEditor();
    </script>
    
  </body>
</html>
