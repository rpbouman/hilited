<!doctype html>
<html>
  <head>
    <title>Hilited</title>
    <link rel="stylesheet" type="text/css" href="../src/Hilited.css"/>
    <script src="../src/SelectionHelper.js"></script>
    <script src="../src/Hilited.js"></script>
    <script src="./samples.js"></script>
    <script src="../../RegXpChef/src/RegXpChef.js"></script>
  </head>
  <body>
    <section class="hilited">
      <menu role="toolbar">
        <li item="menu-item">
          <label for="openFile">Open File
            <input id="openFile" type="file"/>
          </label>
        </li>
        <li item="menu-item">
          <label for="language">Language</label>
          <select id="language">
            <option></option>
          </select>
        </li>
      </menu>
      <pre
        class="hilited-gutter"
        style="
          display: inline-block;
          position: relative;
          width: 8ch;
        "
      >
      </pre>
      <code 
        class="hilited-editor"
        style="
          tab-size:4;
          width: 80ch;
          height: 21rem;
        "
      >{
  "numberkey": 1.234,
  "stringkey": "string value",
  "nullkey": null,
  "truekey": true,
  "falsekey": false
}</code>
      <menu role="toolbar">
        <li class="hilited-length">
          <label for="length">length</label>
          <output id="length"></output>
        </li>
        <li class="hilited-lines">
          <label for="lines">lines</label>
          <output id="lines"></output>
        </li>
        <li class="hilited-line">
          <label for="line">Ln</label>
          <output id="line"></output>
        </li>
        <li class="hilited-column">
          <label for="line">Col</label>
          <output id="column"></output>
        </li>
        <li class="hilited-position">
          <label for="line">Pos</label>
          <output id="position"></output>
        </li>
      </menu>
    </section>

    <script>
      const hilitedElementEditor = document.querySelector('.hilited-editor');
      const gutter = document.querySelector('.hilited-gutter');

      function syncGutterLines(){
        const height = hilitedElementEditor.offsetHeight;
        let last = gutter.lastElementChild;
        let childHeight = last ? last.offsetTop + last.clientHeight : 0;
        while (childHeight < height) {
          const child = document.createElement('div');
          child.textContent = String.fromCharCode(160);
          gutter.appendChild(child);
          childHeight = child.offsetTop + child.clientHeight;
        }
        while (
          (last = gutter.lastElementChild) &&
          (last.offsetTop + last.clientHeight) > height
        ){
          gutter.removeChild(last);
        }
      }
    </script>

    <script>
      const language = document.getElementById('language');
      let hilited = undefined;

      function instantiateEditor(){
        if (hilited) {
          hilited.destroy();
        }
        const value = language.value;
        const sample = hilitedSamples[value];
        const styles = sample.styles;
        if (!document.getElementById(styles)){
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = styles;
          link.id = styles;
          document.head.appendChild(link);
        }
        hilited = new Hilited({
          element: '.hilited-editor',
          text: sample.code,
          hardTabs: false,
          highlighterPrefix: sample.highlighterPrefix,
          regexp: sample.regexp
        });

        const hilitedElementEditor = hilited.element;
        const container = hilitedElementEditor.parentNode;
        const lengthEl = container.querySelector('.hilited-length > output');
        const linesEl = container.querySelector('.hilited-lines > output');
        const lineEl = container.querySelector('.hilited-line > output');
        const columnEl = container.querySelector('.hilited-column > output');
        const positionEl = container.querySelector('.hilited-position > output');

        function updateLengthLines(){
          lengthEl.textContent = hilited.getText().length + 1;
          linesEl.textContent = hilited.getLineCount();
        }

        // seed initial display state
        updateLengthLines();
        syncGutterLines(); // gutter also needs an initial render

        // peripherals — plain event listeners, no classes needed
        hilitedElementEditor.addEventListener('hilited:change', e => updateLengthLines());

        hilitedElementEditor.addEventListener('hilited:select', e => {
          lineEl.textContent = e.detail.line;
          columnEl.textContent = e.detail.column;
          positionEl.textContent = e.detail.position;
        });

        hilitedElementEditor.addEventListener('hilited:resize', syncGutterLines);
        hilitedElementEditor.focus();
      }

      language.addEventListener('change', () => instantiateEditor());

      language.innerHTML = Object.keys(hilitedSamples).sort((a, b) => {
        a = hilitedSamples[a].label || a;
        b = hilitedSamples[b].label || b;
        return a > b ? 1 : a < b ? -1 : 0;
      }).map(key =>
        `<option value="${key}">${hilitedSamples[key].label}</option>`
      ).join('\n');

      instantiateEditor();
    </script>
    
  </body>
</html>
